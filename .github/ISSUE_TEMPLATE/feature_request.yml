name: 개선 제안
description: 더 편리하게 사용할 수 있는 의견을 알려 주세요.
title: "[개선] "
body:
  - type: markdown
    attributes:
      value: 개인정보, 계정 비밀번호, API 키, UID는 쓰지 마세요. 개발 방법을 몰라도 불편했던 상황을 설명하면 됩니다.
  - type: dropdown
    id: screen
    attributes:
      label: 어느 화면에 대한 의견인가요?
      options:
        - 관리자
        - 직원
        - 로그인 또는 공통 화면
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 어떤 점이 불편했나요?
      description: 어떤 일을 하다가 불편했는지 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 어떻게 바뀌면 좋을까요?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 참고 화면이나 추가 설명 (선택)
      description: 이미지는 민감정보를 잘라낸 뒤 붙여 넣거나 끌어 놓아 주세요.
  - type: checkboxes
    id: safety
    attributes:
      label: 제출 전 확인
      options:
        - label: 비밀번호·키·토큰·UID·개인정보가 글과 이미지에 없는지 확인했습니다.
          required: true
